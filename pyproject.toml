[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quasitriviality"
version = "0.1.0"
description = "Formal quasi-Miura transforms and integrability tests in SymPy"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["sympy>=1.12,<2"]

[tool.setuptools.packages.find]
include = ["quasitriviality"]
